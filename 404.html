<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#07070a">
  <meta name="description" content="DFNS — This page could not be found.">
  <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml">
  <title>404 — DFNS</title>
  <style>
    :root{--bg:#07070a;--surface:#101014;--surface2:#17171d;--border:rgba(255,255,255,.09);--border2:rgba(255,255,255,.16);--text:#f7f7fa;--muted:#a3a3ad;--dim:#6f707b;--accent:#7c5cff;--accent2:#a48cff;--green:#4ade80}
    *{box-sizing:border-box;margin:0;padding:0}
    html{min-height:100%;scroll-behavior:smooth}
    body{min-height:100vh;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center;overflow:hidden}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% -10%,rgba(124,92,255,.15),transparent 38%)}
    .page{position:relative;width:min(100% - 40px,900px);text-align:center;padding:50px 20px;animation:pageIn .7s cubic-bezier(.2,.8,.2,1) both}
    .grid{position:fixed;inset:0;opacity:.11;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:56px 56px;mask-image:linear-gradient(to bottom,#000,transparent 90%);pointer-events:none}
    .glow{position:fixed;width:520px;height:520px;border-radius:50%;filter:blur(70px);background:rgba(124,92,255,.13);pointer-events:none;animation:float 7s ease-in-out infinite}
    .glow.one{top:-300px;right:-180px}.glow.two{bottom:-330px;left:-220px;animation-delay:-3s}
    .brand{display:inline-flex;align-items:baseline;gap:9px;color:var(--text);text-decoration:none;margin-bottom:45px;animation:drop .8s .05s both}
    .brand-mark{font-size:26px;font-weight:950;letter-spacing:-.07em}.brand-subtitle{font-size:10px;color:var(--muted);font-weight:800;letter-spacing:.04em}
    .code{font-size:clamp(100px,20vw,190px);line-height:.78;letter-spacing:-.09em;font-weight:950;color:transparent;background:linear-gradient(135deg,#fff 0%,var(--accent2) 45%,var(--accent) 100%);background-clip:text;-webkit-background-clip:text;position:relative;display:inline-block;animation:codeIn .9s cubic-bezier(.16,1,.3,1) both;text-shadow:0 20px 80px rgba(124,92,255,.18)}
    .code:after{content:"404";position:absolute;inset:0;color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.05);transform:translate(7px,7px);z-index:-1}
    .eyebrow{display:inline-flex;align-items:center;gap:9px;margin-top:35px;padding:8px 13px;border:1px solid rgba(251,113,133,.2);border-radius:999px;background:rgba(251,113,133,.055);color:#fb7185;font-size:10px;font-weight:900;letter-spacing:.12em;animation:fadeUp .7s .25s both}
    .dot{width:7px;height:7px;border-radius:50%;background:#fb7185;box-shadow:0 0 14px rgba(251,113,133,.8);animation:pulse 1.8s infinite}
    h1{margin-top:22px;font-size:clamp(30px,5vw,52px);line-height:1;letter-spacing:-.055em;font-weight:950;animation:fadeUp .7s .34s both}
    .description{max-width:570px;margin:18px auto 0;color:var(--muted);font-size:15px;line-height:1.75;animation:fadeUp .7s .42s both}
    .path{display:inline-block;max-width:min(90vw,600px);margin-top:16px;padding:8px 12px;border:1px solid var(--border);border-radius:9px;background:rgba(255,255,255,.025);color:var(--dim);font:11px ui-monospace,SFMono-Regular,Menlo,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;animation:fadeUp .7s .49s both}
    .actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:30px;animation:fadeUp .7s .56s both}
    .button{min-height:46px;padding:0 18px;border-radius:11px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:13px;font-weight:850;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:9px;transition:.2s}
    .button:hover{transform:translateY(-3px);border-color:var(--border2);background:var(--surface2)}
    .button.primary{border-color:transparent;background:var(--accent);box-shadow:0 12px 35px rgba(124,92,255,.2)}.button.primary:hover{background:var(--accent2)}
    .hint{margin-top:38px;color:var(--dim);font-size:10px;letter-spacing:.04em;animation:fadeUp .7s .64s both}
    @keyframes pageIn{from{opacity:0}to{opacity:1}}@keyframes codeIn{from{opacity:0;transform:translateY(30px) scale(.92);filter:blur(12px)}to{opacity:1;transform:none;filter:blur(0)}}@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}@keyframes drop{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}@keyframes float{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(0,25px,0)}}@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.72)}}
    @media(max-width:600px){.page{padding:35px 10px}.brand{margin-bottom:32px}.description{font-size:14px}.path{max-width:calc(100vw - 60px)}.hint{margin-top:30px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <div class="grid"></div><div class="glow one"></div><div class="glow two"></div>
  <main class="page">
    <a class="brand" href="/" aria-label="DFNS home"><span class="brand-mark">DFNS</span><span class="brand-subtitle">Daily Fortnite Shop</span></a>
    <div class="code" aria-hidden="true">404</div>
    <div class="eyebrow"><span class="dot"></span> PAGE NOT FOUND</div>
    <h1>This page doesn't exist.</h1>
    <p class="description">Looks like you've wandered somewhere that DFNS hasn't mapped yet. The page may have been removed, moved, or the URL might be incorrect.</p>
    <code class="path" id="requested-path"></code>
    <div class="actions"><a class="button primary" href="/">← Back to DFNS</a><a class="button" href="/shop.html">View Item Shop →</a></div>
    <p class="hint">DFNS — Daily Fortnite Shop · Unofficial fan project</p>
  </main>
  <script>document.getElementById('requested-path').textContent=window.location.pathname+window.location.search;</script>
</body>
</html>
