<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notifications — DFNS</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/polish.css"><link rel="stylesheet" href="css/auth.css"><style>.notifications-page{min-height:70vh;padding:56px 0 90px}.notifications-heading{display:flex;justify-content:space-between;align-items:end;margin-bottom:30px}.notifications-title{font-size:clamp(34px,5vw,58px);margin:7px 0}.notifications-eyebrow{font-size:11px;letter-spacing:.18em;color:#a78bfa;font-weight:800}.notifications-subtitle{color:rgba(255,255,255,.55)}.notifications-count{padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.09);font-weight:800}.notification-list{display:grid;gap:12px}.notification-card{display:flex;align-items:center;gap:16px;padding:15px;border:1px solid rgba(255,255,255,.08);border-radius:16px;background:rgba(255,255,255,.035);transition:.2s}.notification-card.unread{border-color:rgba(239,68,68,.38);background:linear-gradient(90deg,rgba(239,68,68,.1),rgba(255,255,255,.035))}.notification-image{width:76px;height:76px;border-radius:12px;overflow:hidden;background:rgba(0,0,0,.25);flex:0 0 auto}.notification-image img{width:100%;height:100%;object-fit:cover}.notification-copy{flex:1}.notification-copy strong{display:block;font-size:16px}.notification-copy span{display:block;margin-top:5px;color:rgba(255,255,255,.48);font-size:12px}.notification-actions{display:flex;gap:8px}.notification-actions a,.notification-actions button{border:0;border-radius:9px;padding:9px 12px;background:rgba(139,92,246,.14);color:#fff;text-decoration:none;cursor:pointer}.notification-actions button{background:rgba(255,255,255,.06)}.notifications-empty{padding:70px 20px;text-align:center;border:1px dashed rgba(255,255,255,.12);border-radius:18px;color:rgba(255,255,255,.55)}.notifications-empty h2{color:#fff;margin-bottom:8px}.notifications-empty a{display:inline-block;margin-top:18px;padding:11px 16px;border-radius:10px;background:rgba(139,92,246,.16);color:#fff;text-decoration:none}@media(max-width:650px){.notifications-heading{align-items:start;gap:15px;flex-direction:column}.notification-card{align-items:flex-start}.notification-actions{flex-direction:column}.notification-image{width:62px;height:62px}}</style></head><body><div class="site-wrapper"><header class="site-header"><div class="container header-container"><a class="brand" href="index.html"><span class="brand-mark">DFNS</span><span class="brand-subtitle">Daily Fortnite Shop</span></a><nav class="main-navigation" aria-label="Main navigation"><a class="nav-link" data-nav="home" href="index.html">Home</a><a class="nav-link" data-nav="shop" href="shop.html">Item Shop</a><button class="nav-link nav-button" data-nav="cosmetics" type="button">Cosmetics</button></nav><div class="header-actions"><button class="header-search-button" type="button" data-search-trigger aria-label="Search cosmetics">⌕</button><button class="mobile-menu-button" type="button" data-mobile-menu aria-expanded="false">☰</button></div></div></header><main class="notifications-page"><div class="container"><div class="notifications-heading"><div><span class="notifications-eyebrow">DFNS ALERTS</span><h1 class="notifications-title">Notifications</h1><p class="notifications-subtitle">See when cosmetics you're watching return to the Item Shop.</p></div><div class="notifications-count" id="notifications-count">0 notifications</div></div><div id="notifications-content"></div></div></main></div><script src="js/app.js?v=20260820-3" defer></script><script src="js/auth.js?v=20260820-4" defer></script><script src="js/notifications.js?v=20260820-1" defer></script><script>document.addEventListener('DOMContentLoaded',async()=>{const root=document.querySelector('#notifications-content');const n=window.DFNSNotifications; if(!n)return;await n.check();const list=n.getData();n.renderBadge();if(!list.length){root.innerHTML='<div class="notifications-empty"><h2>No notifications yet</h2><p>Turn on the bell for a cosmetic and we’ll show you here when it returns to the shop.</p><a href="shop.html">Browse Item Shop</a></div>';return}root.innerHTML='<div class="notification-list">'+list.map(x=>`<article class="notification-card ${x.read?'':'unread'}"><div class="notification-image">${x.image?`<img src="${x.image}" alt="">`:''}</div><div class="notification-copy"><strong>${x.name} is back in the Item Shop!</strong><span>${new Date(x.date).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}</span></div><div class="notification-actions"><a href="item.html?id=${encodeURIComponent(x.itemId)}" data-view="${x.id}">View</a><button data-read="${x.id}">${x.read?'Read':'Mark read'}</button></div></article>`).join('')+'</div>';root.querySelectorAll('[data-read]').forEach(b=>b.onclick=()=>{n.markRead(b.dataset.read);b.closest('.notification-card').classList.remove('unread');b.textContent='Read'});});</script></body></html>
