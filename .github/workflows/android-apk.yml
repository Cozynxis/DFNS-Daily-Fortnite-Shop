name: Build DFNS Android APK

on:
  push:
    branches:
      - main
      - automation/android-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm install

      - name: Prepare web assets
        shell: pwsh
        run: ./scripts/prepare-web.ps1

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Restore Android release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/dfns-release.keystore
          test -s android/app/dfns-release.keystore
          cat > android/keystore.properties <<EOF
          storeFile=dfns-release.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build signed release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        shell: bash
        run: cp android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/DFNS-V1.0.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v6
        with:
          name: DFNS-V1.0
          path: android/app/build/outputs/apk/release/DFNS-V1.0.apk
          if-no-files-found: error
          retention-days: 14
