<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DFNS - Daily Fortnite Shop</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;0,900;1,900&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

  <header class="hero">
    <div class="logo-wrapper">
      <h1 class="logo">DFNS</h1>
      <span class="badge">DAILY FORTNITE SHOP</span>
    </div>
    <div id="status-tag" class="status-tag">Laden...</div>
  </header>

  <div class="container">
    <section class="toolbar">
      <input type="text" id="search-input" placeholder="Zoek skin, emote, pickaxe..." autocomplete="off">
      <div class="filter-group">
        <button class="filter-btn active" data-type="all">Alles</button>
        <button class="filter-btn" data-type="outfit">Outfits</button>
        <button class="filter-btn" data-type="emote">Emotes</button>
        <button class="filter-btn" data-type="pickaxe">Pickaxes</button>
      </div>
    </section>

    <main id="app">
      <div id="loader" class="loader">
        <div class="spinner"></div>
        <p>Live Fortnite Shop data binnenhalen...</p>
      </div>

      <div id="error-box" class="error-box hidden">
        <h2>Er ging iets mis</h2>
        <p id="error-msg"></p>
        <button onclick="loadShop()">Opnieuw Proberen</button>
      </div>

      <div id="shop-container"></div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
